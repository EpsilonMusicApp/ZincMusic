name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up signing keystore
        run: |
          mkdir -p $HOME/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from repository secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $HOME/keystores/zincmusic.jks
            echo "ANDROID_KEYSTORE_PATH=$HOME/keystores/zincmusic.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No keystore secret found - generating temporary keystore"
            keytool -genkeypair \
              -keystore $HOME/keystores/zincmusic.jks \
              -storepass zincmusic -keypass zincmusic \
              -alias zinc -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zinc Music, OU=Zinc Music, O=EpsilonMusic, C=IN"
            echo "ANDROID_KEYSTORE_PATH=$HOME/keystores/zincmusic.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=zincmusic" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=zinc" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=zincmusic" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZincMusic-APKs
          path: app/build/outputs/apk/**/*.apk

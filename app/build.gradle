

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    id("com.github.ben-manes.versions") version "0.54.0"
    // Firebase Gradle plugins are resolved up-front but only *applied* when the
    // Firebase config file is committed (see the block right below).
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.firebase.crashlytics.plugin) apply false
}

// Firebase (Analytics + Crashlytics + Cloud Messaging) is wired so that it only
// activates when app/google-services.json exists. Without the config file the
// build stays green, the Firebase SDKs stay dormant at runtime, and pushing the
// real google-services.json into the repo is enough to switch everything on.
if (project.file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    logger.lifecycle('Zinc Music: google-services.json found -> Firebase Analytics, Crashlytics and Messaging ENABLED.')
} else {
    logger.lifecycle('Zinc Music: app/google-services.json not found -> Firebase plugins skipped (dormant build).')
}

// Read credentials from local.properties (secure, gitignored)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

// Use different variable names to avoid conflict with signing config properties
def myKeystoreFile = localProps.getProperty('KEYSTORE_FILE') ?: System.getenv("ANDROID_KEYSTORE_PATH")
def myKeystorePassword = localProps.getProperty('KEYSTORE_PASSWORD') ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def myKeyAlias = localProps.getProperty('KEY_ALIAS') ?: System.getenv("ANDROID_KEY_ALIAS")
def myKeyPassword = localProps.getProperty('KEY_PASSWORD') ?: System.getenv("ANDROID_KEY_ALIAS_PASSWORD")

// Check if all required signing properties are available
def isReleaseSigningReady = myKeystoreFile != null && myKeystorePassword != null && myKeyAlias != null && myKeyPassword != null

android {
    namespace 'com.zincmusic.app'
    compileSdk 37

    // Fix for "App not installed" errors when sharing debug APKs
    project.ext.set("android.injected.testOnly", "false")

    defaultConfig {
        applicationId "com.zincmusic.app"
        minSdk 25
        targetSdk 37
        versionCode 11
        versionName "1.1.9"
        ndk {
            // Modern devices are arm64; shipping one ABI keeps the APK
            // small and light (Epsilon-Music-style build policy).
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (isReleaseSigningReady) {
                storeFile file(myKeystoreFile)
                storePassword myKeystorePassword
                keyAlias myKeyAlias
                keyPassword myKeyPassword
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (isReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            if (isReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


configurations {
    configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation libs.androidx.compose.foundation

    implementation libs.kotlin.stdlib
    implementation libs.glide
    implementation libs.palette


    implementation libs.material.v1140alpha08
    implementation libs.core.splashscreen
    implementation libs.core.ktx
    implementation libs.appcompat.v170
    implementation libs.constraintlayout.v220

    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx

    implementation libs.viewpager2
    implementation libs.swiperefreshlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.navigation.compose

    implementation libs.preference
    implementation libs.room.common.jvm
    implementation libs.room.runtime
    implementation libs.dynamicanimation

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.profileinstaller
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.coil.compose
    implementation libs.material.icons.extended
    implementation libs.foundation
    implementation libs.compose.runtime.livedata


    testImplementation libs.junit
    androidTestImplementation libs.junit.v121
    androidTestImplementation libs.espresso.core.v361

    // Networking & JSON
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor

    // Source: https://mvnrepository.com/artifact/net.jthink/jaudiotagger
    implementation libs.jaudiotagger

    ksp libs.room.compiler

    // Media3 / ExoPlayer
    implementation libs.media3.exoplayer
    implementation libs.media3.session
    implementation libs.media3.common
    implementation libs.media3.ui

    // NewPipe Extractor — local YouTube stream extraction (no proxy dependency).
    // Vendored PATCHED copy in app/libs/NewPipeExtractor-v0.26.1-zinc.jar (see
    // app/libs/README.md): upstream v0.26.x calls URLDecoder.decode/URLEncoder.encode
    // with the (String, Charset) overloads, which only exist from Android API 33 and
    // crashed with NoSuchMethodError on older devices (our minSdk is 25). The patched
    // jar is byte-identical to upstream v0.26.1 except one class. The six explicit
    // dependencies below are the exact former transitive runtime dependencies of
    // com.github.TeamNewPipe:NewPipeExtractor:v0.26.1 (a vendored jar has no POM).
    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.34.1'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Firebase — Analytics + Crashlytics + Cloud Messaging (versions pinned by the BoM).
    // Plugin activation is conditional on app/google-services.json, see top of file.
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.messaging
    implementation libs.firebase.installations

    // Liquid Glass Effect
    implementation libs.liquid
    
    // Graphics Shapes
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
}
